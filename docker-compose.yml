services:
  documind:
    build: .
    container_name: documind-app
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
